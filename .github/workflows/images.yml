name: Fetch site images
on:
  push:
    branches: [main]
    paths: ["tools/images.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_images.py
        continue-on-error: true
      - name: Commit new images and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "SI Photo Booth"
          git config user.email "siphotoboothatl@gmail.com"
          git add static/assets/img
          if git diff --cached --quiet; then echo "no new images"; exit 0; fi
          git commit -m "Add images from images.json"
          git push
          gh workflow run deploy.yml --ref main
