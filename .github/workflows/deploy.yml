name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 10 * * *"   # daily, so posts dated today go live automatically
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  TZ: America/New_York
  # Preview address prefix. Delete this line once siphotoboothatl.com points at GitHub.
  BASE_PATH: /${{ github.event.repository.name }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
